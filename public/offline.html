<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión — FitPrompt</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #101010;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    p  { font-size: 15px; color: #888; line-height: 1.6; max-width: 300px; }
    button {
      margin-top: 8px;
      background: #FF471A;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="icon">⚡</div>
  <h1>Sin conexión</h1>
  <p>No hay red disponible. Comprueba tu conexión y vuelve a intentarlo.</p>
  <button onclick="location.reload()">Reintentar</button>
</body>
</html>
